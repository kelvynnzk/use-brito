<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Use Brito Admin</title>
<link rel="stylesheet" href="/mensagens/templates/static/css/admin.css">
<style>
  body{background:var(--ink);}
  .login-shell{display:flex;min-height:100vh;}
  .login-hero{
    flex:1.1;
    background:var(--ink);
    color:#EDE9E1;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:56px;
    position:relative;
    overflow:hidden;
  }
  .login-hero::after{
    content:'';
    position:absolute;
    right:-120px;
    bottom:-160px;
    width:420px;height:420px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #8B3A2F 0%, transparent 70%);
    opacity:.5;
  }
  .login-hero .top .brand{font-size:26px;color:#fff;}
  .login-hero .top .brand-sub{font-size:12px;color:#8C8578;margin-top:4px;}
  .login-hero .quote{
    font-family:'Fraunces',serif;
    font-size:34px;
    line-height:1.25;
    max-width:420px;
    position:relative;
    z-index:1;
  }
  .login-hero .quote span{color:#C9877E;}
  .login-hero .foot{font-size:12px;color:#726C5F;position:relative;z-index:1;}
  .login-panel{
    flex:1;
    background:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
  }
  .login-box{width:100%;max-width:360px;}
  .login-box h1{font-size:24px;margin-bottom:6px;}
  .login-box .sub{color:var(--slate);font-size:13.5px;margin-bottom:32px;}
  .login-error{
    display:none;
    background:var(--danger-bg);color:#7A2E22;
    padding:10px 14px;border-radius:var(--radius-s);
    font-size:12.5px;margin-bottom:18px;
  }
  .login-error.show{display:block;}
  .login-box .btn-primary{width:100%;padding:11px;margin-top:6px;}
  .login-foot-links{display:flex;justify-content:space-between;margin-top:18px;font-size:12.5px;}
  .login-foot-links a{color:var(--slate);}
  .login-foot-links a:hover{color:var(--clay);}
  .remember{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--slate);margin-bottom:22px;}
  .remember input{width:auto;}
  @media (max-width:820px){.login-hero{display:none;}}
</style>
</head>
<body>

<div class="login-shell">
  <div class="login-hero">
    <div class="top">
      <div class="brand">Use Brito</div>
      <div class="brand-sub">Painel administrativo</div>
    </div>
    <div class="quote">Cada peça tem uma história.<br><span>Cada pedido, um cuidado.</span></div>
    <div class="foot">© 2026 Use Brito. Acesso restrito à equipe.</div>
  </div>

  <div class="login-panel">
    <div class="login-box">
      <h1>Entrar</h1>
      <div class="sub">Acesse o painel para gerenciar pedidos, produtos e clientes.</div>

      <div class="login-error" id="loginError">E-mail ou senha incorretos. Tente novamente.</div>

      <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="voce@usebrito.com.br" required>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <label class="remember">
          <input type="checkbox" id="remember" style="width:16px;height:16px;">
          Manter conectado
        </label>
        <button type="submit" class="btn btn-primary">Entrar</button>
      </form>

      <div class="login-foot-links">
        <a href="#">Esqueci minha senha</a>
        <a href="#">Precisa de ajuda?</a>
      </div>
    </div>
  </div>
</div>

<script>
  // Demo: qualquer e-mail/senha preenchidos entram. Troque por chamada real à API.
  function handleLogin(e){
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('password').value.trim();
    const errorBox = document.getElementById('loginError');
    if(email && pass){
      window.location.href = 'dashboard.html';
    } else {
      errorBox.classList.add('show');
    }
    return false;
  }
</script>
</body>
</html>
